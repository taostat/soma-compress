[package]
name = "soma-compress"
version = "0.1.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
repository = "https://github.com/taostat/soma-compress"
description = "Pure-Rust text-level port of the SOMA OpenClaw compressor."

[dev-dependencies]
proptest = "=1.11.0"

[lints.clippy]
pedantic = { level = "allow", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
unimplemented = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
