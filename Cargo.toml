[package]
name = "soma-compress"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license = "MIT"
publish.workspace = true
description = "Pure-Rust text-level port of the SOMA OpenClaw compressor."

[dev-dependencies]
proptest = "=1.11.0"

[lints.clippy]
pedantic = "allow"
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
unimplemented = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "deny"
print_stderr = "deny"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
